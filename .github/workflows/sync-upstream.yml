
name: Sync Upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/armanlife/firefox-vpn-client.git
          git fetch upstream main
          git fetch origin main

      - name: Prepare synchronization branch
        id: sync
        shell: bash
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "conflict=false" >> "$GITHUB_OUTPUT"

          git checkout -B sync-upstream-main origin/main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "Upstream changes are already included in main."
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "Merge conflict detected. No PR will be created."
            exit 0
          fi

          if git diff --quiet origin/main HEAD; then
            echo "No file changes to propose."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push synchronization branch
        if: steps.sync.outputs.changed == 'true' && steps.sync.outputs.conflict != 'true'
        run: |
          git push --force origin HEAD:refs/heads/sync-upstream-main

      - name: Create or update Pull Request
        if: steps.sync.outputs.changed == 'true' && steps.sync.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REPOSITORY_OWNER:sync-upstream-main" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sync upstream main" \
              --body "Proposed updates from armanlife/firefox-vpn-client:main. Review the changes before merging."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head sync-upstream-main \
              --title "Sync upstream main" \
              --body "Proposed updates from armanlife/firefox-vpn-client:main. Review the changes before merging."
          fi
